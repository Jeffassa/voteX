version: 2

# Un dépôt à trois écosystèmes : chacun a son manifeste et son propre rythme de
# publication d'avis de sécurité. Les regroupements évitent une avalanche de PR
# le lundi matin — sauf pour les correctifs de sécurité, laissés seuls pour être
# fusionnables immédiatement.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /contracts
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      contracts-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
