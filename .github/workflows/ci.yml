# ESATIC SmartVote — Pipeline d'Intégration Continue
#
# Déclenché sur chaque push et pull request vers main.
# Exécute le linting, les tests backend (pytest) et les tests frontend (vitest).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Variables minimales pour que le backend démarre sans DB réelle.
  # ENVIRONMENT reste "development" : les gardes de démarrage refusent ce
  # secret de CI dès qu'on passe en production.
  ENVIRONMENT: development
  DATABASE_URL: sqlite:///./test.db
  JWT_SECRET: ci-testing-secret-long-enough-for-hs256-validation-purposes

# Lecture seule : aucun job n'a besoin d'écrire dans le dépôt. Sans ce bloc,
# le jeton reçoit les droits par défaut du dépôt, parfois en écriture.
permissions:
  contents: read

jobs:
  # ─────────────────────── Backend ───────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v --tb=short

  # ─────────────────────── Frontend ───────────────────────
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      # Contient le garde-fou qui interdit d'écrire dans le stockage du
      # navigateur — sans cette étape, il ne protégerait rien.
      - name: Tests
        run: npm test

      # L'API est un service séparé : le build de production exige son URL.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.smartvote.example
          VITE_SITE_URL: https://smartvote.example

  # ─────────────────────── Smart Contract ───────────────────────
  contracts:
    name: Smart Contracts (Solidity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npx hardhat test
