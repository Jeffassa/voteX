# ESATIC SmartVote — Pipeline d'Intégration Continue
#
# Déclenché sur chaque push et pull request vers main.
# Exécute le linting, les tests backend (pytest) et les tests frontend (vitest).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Variables minimales pour que le backend démarre sans DB réelle.
  # ENVIRONMENT reste "development" : les gardes de démarrage refusent ce
  # secret de CI dès qu'on passe en production.
  ENVIRONMENT: development
  DATABASE_URL: sqlite:///./test.db
  JWT_SECRET: ci-testing-secret-long-enough-for-hs256-validation-purposes

jobs:
  # ─────────────────────── Backend ───────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v --tb=short

  # ─────────────────────── Frontend ───────────────────────
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ─────────────────────── Smart Contract ───────────────────────
  contracts:
    name: Smart Contracts (Solidity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npx hardhat test
