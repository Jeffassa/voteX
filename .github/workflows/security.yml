# Contrôles de sécurité — indépendants de la CI fonctionnelle.
#
# Ils tournent aussi sur `develop` : la CI principale n'écoute que `main`, or
# c'est sur `develop` que le code arrive. Une vulnérabilité découverte trois
# semaines après le merge coûte plus cher qu'un job de cinq minutes.

name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Un scan hebdomadaire attrape les avis publiés APRÈS le dernier commit —
    # la majorité des vulnérabilités apparaissent sur du code qui n'a pas bougé.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  # ─────────────────── Secrets exposés ───────────────────
  secrets:
    name: Fuites de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : un secret retiré dans un commit récent reste
          # exploitable tant qu'il vit dans l'historique.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────── Dépendances Python ───────────────────
  python-deps:
    name: Vulnérabilités Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Auditer requirements.txt
        run: pip-audit --requirement backend/requirements.txt --strict --progress-spinner off

  # ─────────────────── Dépendances Node ───────────────────
  node-deps:
    name: Vulnérabilités Node
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, contracts]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Seul l'audit des dépendances de PRODUCTION bloque : c'est le code
      # réellement livré au navigateur de l'électeur. Une faille dans vite ou
      # vitest concerne le poste du développeur, pas le scrutin — la faire
      # échouer ici entraînerait l'équipe à ignorer un job rouge en permanence.
      - name: npm audit (dépendances livrées)
        working-directory: ${{ matrix.project }}
        run: npm audit --omit=dev --audit-level=high

      # Rapport complet, non bloquant : l'outillage de développement doit être
      # suivi, pas ignoré. Dependabot ouvre les PR correspondantes.
      - name: npm audit (rapport complet, non bloquant)
        working-directory: ${{ matrix.project }}
        continue-on-error: true
        run: npm audit

  # ─────────────────── Analyse statique du code ───────────────────
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # ─────────────────── Lint de sécurité Python ───────────────────
  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Bandit
        run: python -m pip install --upgrade pip bandit[toml]

      - name: Analyser le backend
        # Les tests utilisent assert et des mots de passe factices : les
        # signaler noierait les vrais résultats.
        run: bandit -r backend/app backend/scripts -ll -x backend/tests
