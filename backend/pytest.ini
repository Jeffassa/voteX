[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
asyncio_mode = auto
# Fige la portée de boucle des fixtures asynchrones : pytest-asyncio prévient
# qu'il changera son défaut, et un changement silencieux de portée fait
# partager un event loop entre tests qui n'en veulent pas.
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
