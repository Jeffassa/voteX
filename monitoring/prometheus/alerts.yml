groups:
  - name: smartvote_alerts
    rules:
      # Trois minutes, pas une. Vérifié le 31/08/2026 : deux redéploiements
      # ordinaires — un redémarrage de conteneur, un rechargement de la
      # configuration Vite — ont suffi à émettre deux alertes critiques. Une
      # équipe réveillée par chacune de ses propres mises en production cesse
      # vite de lire ses alertes. Le backend rejoue ses migrations au
      # démarrage : il lui faut ce délai. Au-delà de trois minutes en pleine
      # campagne, en revanche, c'est bien une urgence.
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Backend ESATIC SmartVote est down"
          description: "Le service backend ne répond plus depuis plus de trois minutes."

      - alert: FrontendDown
        expr: probe_success{job="frontend"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Frontend ESATIC SmartVote est down"
          description: "Le service frontend n'est plus accessible."

      - alert: PostgresDown
        expr: up{job="postgres-exporter"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL est down"
          description: "La base de données PostgreSQL n'est plus disponible."

      # Le compteur porte le namespace de l'instrumentation applicative
      # (app/core/metrics.py). L'ancienne règle visait `http_requests_total`,
      # une série jamais produite, et comparait un taux absolu (0,1 req/s) en
      # prétendant mesurer un pourcentage : elle ne pouvait ni se déclencher,
      # ni dire ce qu'elle annonçait.
      - alert: HighErrorRate
        expr: >
          sum(rate(smartvote_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(smartvote_http_requests_total[5m])) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Taux d'erreur HTTP élevé"
          description: "Plus de 10% des requêtes retournent une erreur 5xx."

      # Pas de règle BlockchainDown : aucun job « blockchain » n'est scrapé.
      # `up{job="blockchain"} == 0` ne s'évalue sur aucune série, donc l'alerte
      # ne se déclenchait jamais — elle donnait l'illusion d'une surveillance
      # du nœud Sepolia qui n'existait pas. À rétablir en même temps que le job.

      - alert: VoteSubmissionFailures
        expr: >
          sum(rate(smartvote_http_requests_total{handler="/api/votes/",status=~"5.."}[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Des bulletins sont refusés par une erreur serveur"
          description: >
            Au moins un POST /api/votes/ répond 5xx. Un scrutin ouvert qui perd
            des bulletins est une urgence, pas un avertissement.

      - alert: HighDatabaseConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nombre élevé de connexions DB"
          description: "Plus de 80 connexions actives sur PostgreSQL."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Espace disque faible"
          description: "Moins de 10% d'espace disque disponible."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Utilisation mémoire élevée"
          description: "Plus de 90% de la mémoire système est utilisée."
      - alert: EmailDeliveryFailing
        expr: >
          sum(rate(smartvote_emails_total{outcome="failed"}[10m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Les emails de la plateforme ne partent plus"
          description: >
            Au moins un envoi échoue de façon répétée. Constaté le 31/08/2026 :
            le fournisseur refusait la totalité des messages en 550 sans que
            rien ne le signale. Un code d'activation ou un lien de
            réinitialisation qui n'arrive pas ferme l'accès au scrutin.

      - alert: EmailNotConfigured
        expr: >
          sum(rate(smartvote_emails_total{outcome="not_configured"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Des emails sont abandonnés faute de configuration SMTP"
          description: >
            L'application renonce à envoyer : aucun serveur SMTP n'est
            configuré. Acceptable en développement, jamais pendant une
            campagne électorale.
