server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Logs des conteneurs Docker (adapté Windows)
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: C:\\ProgramData\\docker\\containers\\*\\*log

  # Logs système Windows (optionnel)
  - job_name: eventlog
    windows_events:
      query: '*'
      labelname: source
      interval: 5s